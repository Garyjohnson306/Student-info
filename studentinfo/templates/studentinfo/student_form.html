<!DOCTYPE html>
<html>
<head>
    <title>Student Information</title>
</head>

<body>
    <h1>Student Information</h1>

    <form method="POST">
        {% csrf_token %}
        <label for="student_name">Student Name:</label>
        <input type="text" id="student_name" name="student_name">
        <br><br>

        <label for="student_id">Student ID</label>
        <input type="text" id="student_id" name="student_id">
        <br><br>

        <label for="major">Major:</label>
        <select id="major" name="major">
            <option value="Computer Science">Computer Science</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Health Informatics">Health Informatics</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Financing">Financing</option>
            <option value="Accounting">Accounting</option>
            <option value="Marketing">Marketing</option>
            <option value="Engineering">Engineering</option>
            <option value="Biology">Biology</option>
        </select>
        <br><br>

        <label>Class Standing:</label>
        <input type="radio" id="freshman" name="class_standing" value="Freshman">
        <label for="freshman">Freshman</label>

        <input type="radio" id="sophomore" name="class_standing" value="Sophomore">
        <label for="sophomore">Sophomore</label>

        <input type="radio" id="junior" name="class_standing" value="Junior">
        <label for="junior">Junior</label>

        <input type="radio" id="senior" name="class_standing" value="Senior">
        <label for="senior">Senior</label>
        <br><br>

        <label>Programming languages known:</label>
        <input type="checkbox" id="python" name="languages" value="Python">
        <label for="python">Python</label>

        <input type="checkbox" id="c++" name="languages" value="C++">
        <label for="c++">C++</label>

        <input type="checkbox" id="java" name="languages" value="Java">
        <label for="java">Java</label>

        <input type="checkbox" id="javascript" name="languages" value="Javascript">
        <label for="javascript">Javascript</label>
        
        <input type="checkbox" id="none" name="languages" value="None">
        <label for="none">None</label>
        <br><br>

        <label>Expected Graduation:</label>
        <input type="number" id="graduation_year" name="graduation_year">
        <br><br>

        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments"></textarea>
        <br><br>

        <button type="submit">Submit</button>
    </form>
</body>

</html>
